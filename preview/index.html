(function(){let e=document.createElement(`link`).relList;if(e&&e.supports&&e.supports(`modulepreload`))return;for(let e of document.querySelectorAll(`link[rel="modulepreload"]`))n(e);new MutationObserver(e=>{for(let t of e)if(t.type===`childList`)for(let e of t.addedNodes)e.tagName===`LINK`&&e.rel===`modulepreload`&&n(e)}).observe(document,{childList:!0,subtree:!0});function t(e){let t={};return e.integrity&&(t.integrity=e.integrity),e.referrerPolicy&&(t.referrerPolicy=e.referrerPolicy),t.credentials=e.crossOrigin===`use-credentials`?`include`:e.crossOrigin===`anonymous`?`omit`:`same-origin`,t}function n(e){if(e.ep)return;e.ep=!0;let n=t(e);fetch(e.href,n)}})();var e=(e,t,n,r,i,a,o={})=>({id:t,kind:e,title:n,brief:r,par:i,cfg:a,...o}),t=[{id:`pin`,kind:`pin`,name:`ピンタンブラー錠`,en:`Pin Tumbler`,where:`玄関・南京錠など、いちばん身近なシリンダー錠`,intro:[`外筒（シェル）と内筒（プラグ）をまたいで、上下2段のピンが入っています。`,`鍵がないと上ピン（銀）が境目＝シアラインをまたいでいて、内筒は回りません。`,`鍵の山の高さで下ピン（金）を押し上げ、すべてのピンの境目をシアラインに揃えると回ります。`],tips:[`下ピンが長いほど、鍵は深く削る必要があります。`,`削った金属は戻せません。削りすぎたら新しいブランクキーからやり直し。`,`鍵の山をタップで1段、上下ドラッグでまとめて削れます。`],stages:[e(`pin`,`1-1`,`はじめての鍵`,`ピンの長さを見て、3か所を削ろう`,2,{code:[2,4,1],ghost:!0}),e(`pin`,`1-2`,`4本ピン`,`長いピンほど深く削る`,2,{code:[3,1,5,2],ghost:!0}),e(`pin`,`1-3`,`5本ピン`,`差す前によく観察しよう`,1,{code:[4,2,6,1,3]}),e(`pin`,`1-4`,`のぞき窓`,`内部はシアライン付近しか見えない。差して確かめよう`,4,{code:[2,5,3,0,4]},{vis:`window`}),e(`pin`,`1-5`,`6本ピン`,`ブランクは2本まで`,1,{code:[5,1,4,6,2,3]},{maxBlanks:2}),e(`pin`,`1-6`,`インプレッション`,`中は見えない。回して付いた「当たり跡」の所だけ削っていこう`,6,{code:[3,1,4,2,5]},{vis:`hidden`,maxBlanks:3})]},{id:`wafer`,kind:`wafer`,name:`ウェハータンブラー錠`,en:`Wafer Tumbler`,where:`机の引き出し・ロッカー・自動車のドアなど`,intro:[`ピンの代わりに、窓のあいた薄い板（ウェハー）がバネで押されて並んでいます。`,`鍵がないとウェハーが内筒の外周からはみ出して、外側の溝に引っかかり回りません。`,`鍵がウェハーの窓のふちを押して、すべての板が内筒の中にぴったり収まると回ります。`],tips:[`窓のふちが深い位置にあるウェハーほど、鍵を深く削ります。`,`自動車の鍵のように、上下両側に刻みのある「両面ウェハー」も登場します。`,`青い刻みは鍵の下辺。下から押し上げられているウェハーに対応します。`],stages:[e(`wafer`,`2-1`,`引き出しの鍵`,`窓のふちの位置を見て削ろう`,2,{wafers:[[`t`,3],[`t`,1],[`t`,4],[`t`,2]],ghost:!0}),e(`wafer`,`2-2`,`5枚ウェハー`,`全部の板を
